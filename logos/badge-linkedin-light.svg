<svg xmlns="http://www.w3.org/2000/svg" width="300" height="72" viewBox="0 0 300 72" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs>
  <linearGradient id="g-linkedin-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5cc8ff"><animate attributeName="stop-color" dur="3.6s" repeatCount="indefinite"
      values="#5cc8ff;#3d7bff;#5cc8ff"/></stop>
    <stop offset="1" stop-color="#3d7bff"><animate attributeName="stop-color" dur="3.6s" repeatCount="indefinite"
      values="#3d7bff;#5cc8ff;#3d7bff"/></stop>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5"
      dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur-linkedin-light" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <clipPath id="clip-linkedin-light"><rect x="2" y="2" width="296" height="68" rx="20"/></clipPath>
  <linearGradient id="shine-linkedin-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="2" y="2" width="296" height="68" rx="20" fill="url(#g-linkedin-light)" opacity="0.3"
  filter="url(#blur-linkedin-light)">
  <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite"
    values="0.18;0.30;0.18"/>
</rect>

<rect x="2" y="2" width="296" height="68" rx="20" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<rect x="2.75" y="2.75" width="294.5" height="66.5" rx="19" fill="none"
  stroke="url(#g-linkedin-light)" stroke-width="1.6"/>

<g clip-path="url(#clip-linkedin-light)">
  <rect x="-300" y="0" width="105" height="72" fill="url(#shine-linkedin-light)" transform="skewX(-18)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 720 0; 720 0" keyTimes="0;0.6;1" dur="4.2s" repeatCount="indefinite"/>
  </rect>
</g>

<g transform="translate(20,20)">
  <circle cx="14" cy="14" r="16" fill="#ffffff" opacity="0"/>
  <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#1f2328" stroke-width="1.6"/><circle cx="11.2" cy="11.4" r="1.35" fill="#1f2328"/><rect x="9.9" y="14.4" width="2.6" height="8.2" fill="#1f2328"/><path d="M15.6 22.6v-5.1c0-1.9 1-3.1 2.7-3.1 1.6 0 2.5 1.1 2.5 3.1v5.1h-2.6v-4.6c0-.8-.3-1.3-1-1.3-.6 0-1 .4-1 1.3v4.6h-2.6Z" fill="#1f2328"/>
</g>
<text x="60" y="35" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15"
  font-weight="600" fill="#1f2328">LinkedIn</text>
<text x="60" y="52" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5"
  fill="#59636e">tap to open</text>
</svg>
